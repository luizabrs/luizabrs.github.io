  contents:
    - title: Scientific Initiation / Private Information Retrieval
      institution: University of São Paulo, São Paulo, Brazil
      year: Aug 2023 - Present
      description:
        - I aim to enhance the existing protocol FrodoPIR ( https://eprint.iacr.org/2022/981 ), a stateful Private Information Retrieval (PIR) scheme rooted in the
          learning with errors (LWE) problem. My focus is on refining how the FrodoPIR communicates client-server data.
        - For the theoretical work, I had to dove into a few specific topics such as the GSW scheme, TFHE(Fast Fully Homomorphic Encryption over the Torus) and DGHV(Dijk-
          Gentry-Halevi-Vaikutanathan) schemes, and the mathematical problems used to construct them, i.e., the LWE(Learning with errors) and AGCD(Approximate Greatest
          Common Divisor) problems.
      supervisor: Prof. Hilder Vitor Lima Pereira

    - title: Scientific Initiation / Machine Learning for Text Classification
      institution: University of São Paulo, São Paulo, Brazil and National Deputies Chamber, Justice Court of São Paulo
      year: Mar 2021 - Mar 2022
      description:
        - The project is a bilateral agreement between the University of São Paulo and the São Paulo State Justice Court (TJSP) to create an Artificial Intelligence that makes Natural
          Language Processing tasks on the Brazilian Legal court. My main work was to deal with machine learning techniques and do deep research on them and their applicability
          in our domain, testing and adapting them to enhance our results. My tasks are the following:
        - Article mapping for machine learning techniques applied to named entity recognition.
        - Article survey for BERT and Information Retrieval Techniques.
        - Worked on inconsistency verification in the database that caused problems with preprocessing results.
        - Working on Entities Annotation to create a new Legal Portuguese Corpus. Targeting something new and without any previous publication.
        - Working on a revision article with other 3 PhDs of Named Entity Recognition applied in Portuguese and Legal Domain. It targets something new and without
          any previous publication.
        - Working with an interdisciplinary team of politicians, computer engineers and computer scientists.
        - Scientific initiation with recognized scholarship.
        - Publication: UlyssesNER-Br: A Corpus of Brazilian Legislative Documents for Named Entity Recognition: https://link.springer.com/chapter/10.1007/978-3-030-98305-5_1
      supervisor: Prof. André Carlos Ponce de Leon Ferreira de Carvalho

